<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup Sessions - GreenWorld</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            background: #1e40af;
            color: #e0e7ff;
            border: 1px solid #3b82f6;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #1e3a8a;
            border-color: #60a5fa;
        }

        .card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 30px;
        }

        .legend {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
            padding: 15px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }

        .legend-color.completed {
            background: #10b981;
        }

        .legend-color.running {
            background: #f59e0b;
        }

        .legend-color.failed {
            background: #ef4444;
        }

        .legend-color.cumulative {
            background: transparent;
            border: 2px dashed #3b82f6;
        }

        /* Session Log Table */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(30, 41, 59, 0.7);
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        }

        th {
            padding: 16px 20px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #cbd5e1;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
            font-size: 14px;
            color: #cbd5e1;
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(30, 41, 59, 0.5);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-completed {
            background: rgba(16, 185, 129, 0.1);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-running {
            background: rgba(245, 158, 11, 0.1);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-failed {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-icon {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-icon.completed {
            background: #10b981;
        }

        .status-icon.running {
            animation: spin 2s linear infinite;
            background: #f59e0b;
        }

        .status-icon.failed {
            background: #ef4444;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 16px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .nav-link {
            color: #60a5fa;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .nav-link:hover {
            color: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="nav-link">← Back to Dashboard</a>
        
        <header>
            <h1>📊 Backup Sessions</h1>
            <div class="btn-group">
                <button onclick="refreshData()">🔄 Refresh</button>
            </div>
        </header>

        <!-- Chart Card -->
        <div class="card">
            <div class="card-title">Backup Sessions (Past 7 Days)</div>
            <div class="chart-container">
                <canvas id="backupChart"></canvas>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color completed"></div>
                    <span>Completed</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color running"></div>
                    <span>Running</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color failed"></div>
                    <span>Failed</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color cumulative"></div>
                    <span>Cumulative size (MB)</span>
                </div>
            </div>
        </div>

        <!-- Session Log Card -->
        <div class="card">
            <div class="card-title">Session log</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>SESSION</th>
                            <th>STATUS</th>
                            <th>SIZE (MB)</th>
                            <th>DURATION</th>
                        </tr>
                    </thead>
                    <tbody id="sessionTableBody">
                        <tr>
                            <td colspan="5" class="loading">Loading session data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let chartInstance = null;

        async function loadChartData() {
            try {
                const response = await fetch('/api/rman/sessions-chart');
                const data = await response.json();
                
                if (data.error) {
                    console.error('Error:', data.error);
                    return null;
                }
                
                return data.chart || [];
            } catch (error) {
                console.error('Failed to load chart data:', error);
                return null;
            }
        }

        async function loadSessionLog() {
            try {
                const response = await fetch('/api/rman/session-log');
                const data = await response.json();
                
                if (data.error) {
                    console.error('Error:', data.error);
                    return [];
                }
                
                return data.sessions || [];
            } catch (error) {
                console.error('Failed to load session log:', error);
                return [];
            }
        }

        function initChart(chartData) {
            const ctx = document.getElementById('backupChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartData.map(d => d.day),
                    datasets: [
                        {
                            label: 'Completed',
                            data: chartData.map(d => d.completed),
                            backgroundColor: '#10b981',
                            borderColor: '#047857',
                            borderWidth: 0,
                            stack: 'Stack 0'
                        },
                        {
                            label: 'Running',
                            data: chartData.map(d => d.running),
                            backgroundColor: '#f59e0b',
                            borderColor: '#d97706',
                            borderWidth: 0,
                            stack: 'Stack 0'
                        },
                        {
                            label: 'Failed',
                            data: chartData.map(d => d.failed),
                            backgroundColor: '#ef4444',
                            borderColor: '#dc2626',
                            borderWidth: 0,
                            stack: 'Stack 0'
                        },
                        {
                            label: 'Cumulative size (MB)',
                            data: chartData.map(d => d.cumulative_mb),
                            type: 'line',
                            borderColor: '#3b82f6',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            fill: false,
                            tension: 0.4,
                            pointRadius: 5,
                            pointBackgroundColor: '#3b82f6',
                            pointBorderColor: '#ffffff',
                            pointBorderWidth: 2,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#f1f5f9',
                            bodyColor: '#cbd5e1',
                            borderColor: 'rgba(51, 65, 85, 0.5)',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: true,
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += context.parsed.y.toFixed(2) + ' MB';
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            stacked: true,
                            ticks: {
                                color: '#cbd5e1',
                                font: {
                                    size: 12
                                }
                            },
                            grid: {
                                color: 'rgba(51, 65, 85, 0.2)',
                                drawBorder: false
                            },
                            title: {
                                display: true,
                                text: 'Size (MB)',
                                color: '#cbd5e1'
                            }
                        },
                        y1: {
                            type: 'linear',
                            position: 'right',
                            ticks: {
                                color: '#3b82f6',
                                font: {
                                    size: 12
                                }
                            },
                            grid: {
                                drawOnChartArea: false,
                                drawBorder: false
                            },
                            title: {
                                display: true,
                                text: 'Cumulative (MB)',
                                color: '#3b82f6'
                            }
                        },
                        x: {
                            ticks: {
                                color: '#cbd5e1',
                                font: {
                                    size: 12
                                }
                            },
                            grid: {
                                color: 'rgba(51, 65, 85, 0.2)',
                                drawBorder: false
                            }
                        }
                    }
                }
            });
        }

        function populateSessionTable(sessions) {
            const tbody = document.getElementById('sessionTableBody');
            
            if (sessions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="loading">No session data available</td></tr>';
                return;
            }

            tbody.innerHTML = sessions.map(session => {
                const statusClass = session.status.toLowerCase();
                const statusIcon = statusClass === 'completed' ? '✓' : 
                                  statusClass === 'running' ? '⟳' : '✕';
                
                return `
                    <tr>
                        <td>${session.date}</td>
                        <td><strong>${session.session}</strong></td>
                        <td>
                            <span class="status-badge status-${statusClass}">
                                <span class="status-icon ${statusClass}"></span>
                                ${session.status}
                            </span>
                        </td>
                        <td>${session.size_mb.toFixed(2)}</td>
                        <td>${session.duration}</td>
                    </tr>
                `;
            }).join('');
        }

        async function refreshData() {
            const chartData = await loadChartData();
            const sessionData = await loadSessionLog();

            if (chartData && chartData.length > 0) {
                initChart(chartData);
            } else {
                document.getElementById('backupChart').getContext('2d').clearRect(0, 0, 500, 300);
                console.error('No chart data available');
            }

            populateSessionTable(sessionData);
        }

        // Initial load
        document.addEventListener('DOMContentLoaded', refreshData);
    </script>
</body>
</html>
